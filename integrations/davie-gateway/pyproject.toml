[project]
name = "stackchan-davie-gateway"
version = "0.1.0"
description = "Local Xiaozhi-compatible voice gateway for StackChan and Davie"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
]

[project.scripts]
stackchan-davie-gateway = "stackchan_davie_gateway.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackchan_davie_gateway"]
