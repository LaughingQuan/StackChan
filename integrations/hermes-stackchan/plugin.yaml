name: jm-stackchan
version: 0.2.0
description: >-
  Davie's local StackChan body adapter. Exposes explicit, testable tools for
  health/capability discovery and, when the device is awake, speech, vision,
  reading, and conservative device control through the authenticated local
  StackChan gateway.
author: JM / Codex
kind: standalone
provides_tools:
  - stackchan_status
  - stackchan_say
  - stackchan_vision
  - stackchan_reader
  - stackchan_control
  - stackchan_reminder
  - stackchan_storage
provides_hooks:
  - pre_llm_call
  - transform_llm_output
  - pre_gateway_dispatch
